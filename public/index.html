<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #7b8498;
      --border: #e3e6ee;
      --accent: #5b6cf0;
      --accent-hover: #4856d6;
      --danger: #d6455d;
      --shadow: 0 8px 30px rgba(30, 40, 90, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --card: #1b1f2b;
        --text: #e8ebf4;
        --muted: #8b93a8;
        --border: #2a3042;
        --accent: #7886ff;
        --accent-hover: #929eff;
        --danger: #ff6b82;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 28px;
      height: fit-content;
    }
    h1 { margin: 0 0 20px; font-size: 28px; letter-spacing: -0.5px; }
    form { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    form button {
      padding: 12px 18px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
    }
    form button:hover { background: var(--accent-hover); }
    form button:active { transform: scale(0.97); }
    #error { color: var(--danger); min-height: 1.4em; margin: 8px 0 4px; font-size: 14px; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    ul:empty::before { content: "Пока заметок нет. Добавь первую!"; color: var(--muted); text-align: center; padding: 24px 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      word-break: break-word;
    }
    li button {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }
    li button:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Заметки</h1>
    <form id="form">
      <input id="text" placeholder="Купить молоко" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>
    <p id="error"></p>
    <ul id="list"></ul>
  </main>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('text');
    const error = document.getElementById('error');

    async function load() {
      const res = await fetch('/api/notes');
      const notes = await res.json();
      list.innerHTML = '';
      notes.forEach((n) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = n.text;
        const btn = document.createElement('button');
        btn.textContent = 'Удалить';
        btn.onclick = async () => {
          await fetch('/api/notes/' + n.id, { method: 'DELETE' });
          load();
        };
        li.append(span, btn);
        list.append(li);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input.value })
      });
      if (!res.ok) {
        error.textContent = (await res.json()).error;
        return;
      }
      input.value = '';
      load();
    });

    load();
  </script>
</body>
</html>
